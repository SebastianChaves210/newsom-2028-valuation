name: Daily data + model refresh

on:
  schedule:
    - cron: "17 11 * * *"   # daily, 11:17 UTC (early morning US)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install
        run: uv sync --no-editable --extra dev

      - name: Run tests
        run: uv run --no-editable --extra dev pytest -q

      - name: Collect data and run models
        run: uv run --no-editable --extra dev newsom2028 run
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}

      - name: Commit refreshed data, report, dashboard
        run: |
          git config user.name "newsom2028-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports dashboard
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Daily refresh: $(date -u +%F)"
            git push
          fi
