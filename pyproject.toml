[project]
name = "newsom2028"
version = "0.1.0"
description = "Quantitative valuation of Gavin Newsom's 2028 presidential prediction-market contracts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "requests>=2.32",
    "plotly>=5.24",
    "lxml>=5.0",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
newsom2028 = "newsom2028.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsom2028"]

# Rebuild the (non-editable) install whenever source changes, not just pyproject.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
